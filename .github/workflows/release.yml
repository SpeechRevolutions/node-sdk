# Publish to npm when a version tag is pushed.
#
# Tests gate the publish. npm allows unpublish only within 72 hours and never
# afterwards, so a bad version is effectively permanent.
#
# The functional suite drives the API mock that lives in the python-sdk repo —
# the same reference implementation every SDK tests against, so none of them can
# drift from the contract. CI checks it out alongside and points SR_MOCK_API at
# it, since the sibling path only exists on a developer's machine.
#
# Needs secrets.NPM_TOKEN: an npm granular access token with publish rights on
# the @speechrevolutions scope.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SpeechRevolutions/python-sdk
          path: _mock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
        env:
          SR_MOCK_API: ${{ github.workspace }}/_mock/tests/mock_api.py

  version-matches-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag and package.json must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

  publish:
    needs: [test, version-matches-tag]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write          # lets npm attach a provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # --access public is also set in package.json's publishConfig; a scoped
      # package is private by default and the publish simply fails without it.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
